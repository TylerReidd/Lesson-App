<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // redirect unknown URLs back to index.html so React Router can handle them
    const redirectTo = '/' + window.location.pathname.split('/').slice(2).join('/');
    window.history.replaceState(null, '', redirectTo);
    window.location.replace(window.location.origin + '/lesson-app/');
  </script>
